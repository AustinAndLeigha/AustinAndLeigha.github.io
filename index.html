<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Austin & Leigha's Christmas List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #9b1c1c;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gift-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gift-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .gift-card h2 {
            margin-top: 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .claim-button {
            background: #176b39;
            color: white;
        }

        .claim-button:hover {
            background: #10542c;
        }

        .gift-card a {
            display: inline-block;
            margin-bottom: 10px;
            color: #176b39;
            font-weight: bold;
            text-decoration: none;
        }

        .gift-card a:hover {
            text-decoration: underline;
        }

        .gift-card button:disabled {
            background: #aaaaaa;
            color: white;
            cursor: not-allowed;
        }

        .registry-section {
            margin-bottom: 50px;
        }

        .registry-section > h2 {
            margin-bottom: 20px;
            font-size: 28px;
        }


        /* Modal background */
        .modal {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.6);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }


        /* Hide modal */
        .hidden {
            display: none;
        }


        /* Modal box */
        .modal-content {
            background: white;

            width: 100%;
            max-width: 450px;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }


        .modal-content h2 {
            margin-top: 0;
            color: #9b1c1c;
        }


        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;

            margin-top: 25px;
        }


        .cancel-button {
            background: #dddddd;
            color: #222;
        }


        .cancel-button:hover {
            background: #cccccc;
        }

        .gift-image {
            width: 100%;
            height: 220px;

            object-fit: contain;

            border-radius: 8px;

            margin-bottom: 15px;

            background: #f7f7f7;
        }
    </style>
</head>

<body>

<header>
    <h1>🎄 Austin & Leigha's Christmas List 🎄</h1>
    <p>Find something you'd like to get us and claim it!</p>
</header>

<main>



    <section class="registry-section">
        <h2>🎁 Austin's Christmas List</h2>

        <div id="austin-gift-list" class="gift-list">
            <p>Loading Austin's Christmas ideas...</p>
        </div>
    </section>


    <section class="registry-section">
        <h2>🎁 Leigha's Christmas List</h2>

        <div id="leigha-gift-list" class="gift-list">
            <p>Loading Leigha's Christmas ideas...</p>
        </div>
    </section>

</main>

<div id="claim-modal" class="modal hidden">

    <div class="modal-content">

        <h2>🎄 Claim This Gift?</h2>

        <p id="claim-modal-message">
            Are you sure you want to claim this gift?
        </p>

        <div class="modal-buttons">

            <button id="cancel-claim" class="cancel-button">
                Never Mind
            </button>

            <button id="confirm-claim" class="claim-button">
                Yes, Claim It!
            </button>

        </div>

    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
