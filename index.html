<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Austin & Leigha's Christmas List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #9b1c1c;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gift-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gift-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .gift-card h2 {
            margin-top: 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .claim-button {
            background: #176b39;
            color: white;
        }

        .claim-button:hover {
            background: #10542c;
        }

        .gift-card a {
            display: inline-block;
            margin-bottom: 10px;
            color: #176b39;
            font-weight: bold;
            text-decoration: none;
        }

        .gift-card a:hover {
            text-decoration: underline;
        }

        .gift-card button:disabled {
            background: #aaaaaa;
            color: white;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<header>
    <h1>🎄 Austin & Leigha's Christmas List 🎄</h1>
    <p>Find something you'd like to get us and claim it!</p>
</header>

<main>

    <h2>Christmas Ideas</h2>

    <div id="gift-list" class="gift-list">

        <p id="loading-message">
            Loading Christmas ideas...
        </p>

    </div>

</main>

<script type="module" src="app.js"></script>

</body>
</html>
